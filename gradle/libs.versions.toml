[versions]
kotlin = "2.4.21"
# AGP 8.13 is the last stable line using Build Tools 35.0.0.
agp = "8.13.2"
# Compose 1.12 requires compileSdk 37; keep the latest API 35-compatible line.
compose-multiplatform = "1.11.1"
activity-compose = "1.10.1"
coroutines = "1.11.0"
serialization = "1.12.0"
kotlinx-io = "0.9.2"
concentus = "1.0.2"
android-compileSdk = "35"
android-targetSdk = "35"
android-minSdk = "26"
android-buildTools = "35.0.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
# Version pins required by #1; no runtime dependencies until there is a consumer.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
# Pure-JVM Opus port; JVM-only, so it lives in the jvmShared source set.
concentus = { module = "io.github.jaredmdobson:concentus", version.ref = "concentus" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
