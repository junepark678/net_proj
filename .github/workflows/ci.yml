name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all modules and run unit tests
        run: ./gradlew --no-daemon build :shared:allTests :ui:allTests
      - name: Upload JUnit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          if-no-files-found: ignore
          path: '**/build/test-results/**/*.xml'

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          if-no-files-found: error
          path: androidApp/build/outputs/apk/debug/*.apk

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build desktop distributable
        run: ./gradlew --no-daemon :desktopApp:createDistributable
      - name: Upload desktop distributable
        uses: actions/upload-artifact@v4
        with:
          name: desktop-distributable
          if-no-files-found: error
          path: desktopApp/build/compose/binaries/main/app/**

  qualify-emulator:
    if: contains(github.event.pull_request.labels.*.name, 'qualify:emulator')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android instrumentation tests on an AOSP emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon :androidApp:connectedDebugAndroidTest

  qualify-tor:
    if: contains(github.event.pull_request.labels.*.name, 'qualify:tor')
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder for #25 Tor qualification
        run: echo "Tor qualification is implemented by issue #25" && exit 0
