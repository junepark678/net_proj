name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all modules and run unit tests
        run: ./gradlew --no-daemon build :shared:allTests :ui:allTests
      - name: Upload JUnit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          if-no-files-found: ignore
          path: '**/build/test-results/**/*.xml'

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          if-no-files-found: error
          path: androidApp/build/outputs/apk/debug/*.apk

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build desktop distributable
        run: ./gradlew --no-daemon :desktopApp:createDistributable
      - name: Upload desktop distributable
        uses: actions/upload-artifact@v4
        with:
          name: desktop-distributable
          if-no-files-found: error
          path: desktopApp/build/compose/binaries/main/app/**

  qualify-emulator:
    if: contains(github.event.pull_request.labels.*.name, 'qualify:emulator')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests on an AOSP emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon :androidApp:connectedDebugAndroidTest

  qualify-tor:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'qualify:tor')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TOR_PROCESS_BINARY: /usr/bin/tor
      TOR_PROCESS_SMOKE_BINARY: /usr/bin/tor
      TOR_CONTROL_SMOKE_BINARY: /usr/bin/tor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Tor from the Tor Project repository
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          key_file="$RUNNER_TEMP/deb.torproject.org.asc"
          curl --fail --silent --show-error --location \
            https://deb.torproject.org/torproject.org/A3C4F0F979CAA22CDBA8F512EE8CBC9E886DDD89.asc \
            --output "$key_file"
          fingerprint="$(gpg --show-keys --with-colons "$key_file" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "A3C4F0F979CAA22CDBA8F512EE8CBC9E886DDD89"
          gpg --dearmor --output "$RUNNER_TEMP/deb.torproject.org-keyring.gpg" "$key_file"
          sudo install -m 0644 "$RUNNER_TEMP/deb.torproject.org-keyring.gpg" \
            /usr/share/keyrings/deb.torproject.org-keyring.gpg
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://deb.torproject.org/torproject.org/\nSuites: %s\nComponents: main\nSigned-By: /usr/share/keyrings/deb.torproject.org-keyring.gpg\n' \
            "$codename" | sudo tee /etc/apt/sources.list.d/tor.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y tor deb.torproject.org-keyring
          tor --version
      - name: Run Tor control and two-engine loopback qualification
        run: ./gradlew --no-daemon torLoopbackTest
      - name: Run 60-second two-engine audio call over real Tor
        run: ./gradlew --no-daemon :tools:simulate --args="--preset tor-real --seconds 60 --out build/tor-qualification"
      - name: Upload Tor qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-qualification
          if-no-files-found: ignore
          path: |
            build/tor-loopback/**
            build/tor-qualification/**
            shared/build/test-results/desktopTest/**
