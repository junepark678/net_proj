<svg xmlns="http://www.w3.org/2000/svg" width="15cm" height="7.62cm" viewBox="0 0 1772 900"><rect width="100%" height="100%" fill="white"/><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#111} .title{font-size:36px;font-weight:bold}.label{font-size:27px;font-weight:bold}.small{font-size:21px}.tiny{font-size:18px}.box{fill:#f1f1f1;stroke:#222;stroke-width:3}.nat{fill:#ddd;stroke:#222;stroke-width:3}.internet{fill:#fff;stroke:#444;stroke-width:3;stroke-dasharray:8 6}.solid{fill:none;stroke:#111;stroke-width:5;marker-end:url(#a)}.dash{fill:none;stroke:#555;stroke-width:4;stroke-dasharray:12 8;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><rect x="24" y="18" width="568" height="690" rx="12" class="internet"/><text x="308" y="65" text-anchor="middle" class="title">(a) STUN 홀 펀칭</text><rect x="49" y="330" width="110" height="78" rx="12" class="box"/><text x="104" y="362" text-anchor="middle" class="small">A: 스마트폰</text><text x="104" y="390" text-anchor="middle" class="tiny">기기</text><rect x="174" y="310" width="100" height="120" rx="12" class="nat"/><text x="224" y="355" text-anchor="middle" class="small">CGNAT</text><text x="224" y="387" text-anchor="middle" class="tiny">NAT</text><rect x="324" y="310" width="100" height="120" rx="12" class="nat"/><text x="374" y="355" text-anchor="middle" class="small">가정용</text><text x="374" y="387" text-anchor="middle" class="tiny">라우터 NAT</text><rect x="449" y="330" width="110" height="78" rx="12" class="box"/><text x="504" y="362" text-anchor="middle" class="small">B: PC</text><text x="504" y="390" text-anchor="middle" class="tiny">기기</text><rect x="262" y="120" width="100" height="70" rx="12" class="box"/><text x="312" y="162" text-anchor="middle" class="small">STUN</text><path d="M104,330 L299,190" class="dash"/><path d="M504,330 L324,190" class="dash"/><path d="M134,370 L479,370" class="solid"/><text x="308" y="475" text-anchor="middle" class="tiny">UDP 直連・穴開け後にメディア</text><text x="308" y="637" text-anchor="middle" class="tiny">STUN으로 매핑 주소를 확인한 뒤 UDP 직접 연결</text><rect x="602" y="18" width="568" height="690" rx="12" class="internet"/><text x="886" y="65" text-anchor="middle" class="title">(b) TURN 릴레이</text><rect x="627" y="330" width="110" height="78" rx="12" class="box"/><text x="682" y="362" text-anchor="middle" class="small">A: 스마트폰</text><text x="682" y="390" text-anchor="middle" class="tiny">기기</text><rect x="752" y="310" width="100" height="120" rx="12" class="nat"/><text x="802" y="355" text-anchor="middle" class="small">CGNAT</text><text x="802" y="387" text-anchor="middle" class="tiny">NAT</text><rect x="902" y="310" width="100" height="120" rx="12" class="nat"/><text x="952" y="355" text-anchor="middle" class="small">가정용</text><text x="952" y="387" text-anchor="middle" class="tiny">라우터 NAT</text><rect x="1027" y="330" width="110" height="78" rx="12" class="box"/><text x="1082" y="362" text-anchor="middle" class="small">B: PC</text><text x="1082" y="390" text-anchor="middle" class="tiny">기기</text><rect x="840" y="120" width="100" height="70" rx="12" class="box"/><text x="890" y="162" text-anchor="middle" class="small">TURN</text><path d="M682,330 L877,190" class="solid"/><path d="M1082,330 L902,190" class="solid"/><path d="M712,370 L1057,370" class="solid"/><text x="886" y="475" text-anchor="middle" class="tiny">双方が外向き接続、TURN がメディア中継</text><text x="886" y="637" text-anchor="middle" class="tiny">두 피어의 미디어를 TURN 서버가 릴레이</text><rect x="1180" y="18" width="568" height="690" rx="12" class="internet"/><text x="1464" y="65" text-anchor="middle" class="title">(c) Tor 어니언 서비스 랑데부</text><rect x="1205" y="330" width="110" height="78" rx="12" class="box"/><text x="1260" y="362" text-anchor="middle" class="small">A: 스마트폰</text><text x="1260" y="390" text-anchor="middle" class="tiny">기기</text><rect x="1330" y="310" width="100" height="120" rx="12" class="nat"/><text x="1380" y="355" text-anchor="middle" class="small">CGNAT</text><text x="1380" y="387" text-anchor="middle" class="tiny">NAT</text><rect x="1480" y="310" width="100" height="120" rx="12" class="nat"/><text x="1530" y="355" text-anchor="middle" class="small">가정용</text><text x="1530" y="387" text-anchor="middle" class="tiny">라우터 NAT</text><rect x="1605" y="330" width="110" height="78" rx="12" class="box"/><text x="1660" y="362" text-anchor="middle" class="small">B: PC</text><text x="1660" y="390" text-anchor="middle" class="tiny">기기</text><rect x="1405" y="115" width="120" height="54" rx="12" class="box"/><text x="1465" y="150" text-anchor="middle" class="tiny">紹介点</text><rect x="1405" y="190" width="120" height="54" rx="12" class="box"/><text x="1465" y="225" text-anchor="middle" class="tiny">ランデブー点</text><path d="M1260,330 L1430,160" class="dash"/><path d="M1660,330 L1500,220" class="dash"/><path d="M1290,370 L1635,370" class="solid"/><text x="1464" y="475" text-anchor="middle" class="tiny">Tor 回路は各 3 ホップ：全通信が外向き TCP</text><rect x="1272" y="515" width="384" height="64" rx="12" class="box"/><text x="1464" y="555" text-anchor="middle" class="label">NAT에 포트 개방 없음</text><text x="1464" y="637" text-anchor="middle" class="tiny">소개점에 게시하고 랑데부 지점에서 회선 연결</text><path d="M130,780 L230,780" class="solid"/><text x="244" y="787" text-anchor="start" class="tiny">실선 = 미디어</text><path d="M490,780 L590,780" class="dash"/><text x="605" y="787" text-anchor="start" class="tiny">점선 = 시그널링/제어</text><path d="M965,780 L1065,780" class="solid"/><text x="1080" y="787" text-anchor="start" class="tiny">화살표 = 연결 시작 방향</text></svg>