<svg xmlns="http://www.w3.org/2000/svg" width="15cm" height="24.9cm" viewBox="0 0 1000 1660">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:'Noto Sans CJK KR';fill:#111;font-size:21px}.title{font-size:27px;font-weight:bold}.bold{font-weight:bold}.panel{fill:white;stroke:#aaa;stroke-width:1.5}.box{fill:#f5f5f5;stroke:#333;stroke-width:2}.nat{fill:#e4e4e4;stroke:#333;stroke-width:2}.media,.control{fill:none;stroke:#222;stroke-width:3;marker-end:url(#arrow)}.media{marker-start:url(#arrow)}.control{stroke-dasharray:8 6}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#222" stroke-width="1.3"/></marker></defs>
<rect x="15" y="15" width="970" height="490" rx="8" class="panel"/>
