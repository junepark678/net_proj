<path d="M135,1325 V1372 H260" class="control"/>
<path d="M865,1325 V1372 H740" class="control"/>
<path d="M355,1405 V1462 H385" class="control"/>
<path d="M645,1405 V1462 H615" class="control"/>
<path d="M135,1325 V1390 H260" class="media"/>
<path d="M355,1405 V1480 H385" class="media"/>
<path d="M865,1325 V1390 H740" class="media"/>
<path d="M645,1405 V1480 H615" class="media"/>
<text x="500" y="1540" class="" text-anchor="middle">④ 두 회로가 랑데부에서 만남 · 미디어 약 6홉</text>
